{ n:7, code:'CH-07', short:'Ambiente gráfico: Xorg + i3', time:'40 min', title:'Ambiente gráfico: Xorg, rato, teclado e i3',
  lead:'Um ambiente gráfico mínimo, conduzido por teclado: o servidor Xorg, um gestor de janelas em mosaico e dispositivos de entrada configurados uma vez e documentados.',
  sections:[
  {h:'Instalar a pilha', html:code('sh', `pkg install -y xorg xinit xterm xinput i3 i3status i3lock dmenu dbus xf86-input-libinput\nsysrc dbus_enable="YES"\nservice dbus start\npw groupmod video -m alice          # acesso ao dispositivo gráfico (os nomes dos grupos variam)`)},
  {h:'Controlador gráfico', html:`<p>A aceleração de hardware precisa dos controladores em modo kernel do <code>drm-kmod</code>. Veja o que o seu lançamento oferece e carregue o módulo certo para a sua GPU. Sem ele, o Xorg recorre a um framebuffer genérico: serve para testar, é lento para trabalhar.</p>` + code('sh', `pkg search drm-                     # listar os controladores drm do seu lançamento\npkg install -y drm-kmod             # Intel e AMD; confirme o nome exacto para o seu lançamento\nsysrc kld_list+="i915kms"           # exemplo Intel; a AMD usa amdgpu, verifique o dmesg`)},
  {h:'Rato e touchpad', html:`<p>O daemon de rato da consola serve <code>/dev/sysmouse</code>. Dentro do Xorg, o controlador libinput trata dos dispositivos apontadores depois de instalado.</p>` + code('sh', `sysrc moused_enable="YES"\nservice moused start\nxinput list                         # confirmar os dispositivos que o Xorg vê`)},
  {h:'Mapa de teclado', html:`<p>Defina o mapa da consola em <code>rc.conf</code> e o do Xorg num ficheiro drop-in. Substitua <code>us</code> pelo seu mapa.</p>` + code('sh', `sysrc keymap="us.iso.kbd"`) + code('conf — /usr/local/etc/X11/xorg.conf.d/10-keyboard.conf', `Section "InputClass"\n    Identifier "keyboard-layout"\n    MatchIsKeyboard "on"\n    Option "XkbLayout" "us"\n    Option "XkbVariant" "intl"\nEndSection`)},
  {h:'Arrancar o X e ligar o i3', html:`<p>Entregue a sessão ao i3 com <code>~/.xinitrc</code> e arranque o X a partir de uma consola. O <code>i3-config-wizard</code> gera uma configuração inicial.</p>` + code('sh', `echo "exec i3" > ~/.xinitrc\nstartx`) + code('conf — ~/.config/i3/config (excerto)', `set $mod Mod4\nfont pango:monospace 10\nfloating_modifier $mod\nbindsym $mod+Return exec xterm\nbindsym $mod+d exec dmenu_run\nbindsym $mod+Shift+q kill\nbindsym $mod+Shift+x exec i3lock -c 000000\nbindsym $mod+1 workspace number 1\nbindsym $mod+2 workspace number 2`)},
  {h:'Segurança no ambiente gráfico', html:`<p>Uma sessão gráfica é uma vista privilegiada do que escreve. Mantenha o controlo de acesso ao X ligado, corra a sessão como utilizador normal e bloqueie o ecrã quando sair.</p>` + note('bad','Má decisão: xhost + e startx como root','<p>O <code>xhost +</code> desliga o controlo de acesso ao X, e qualquer processo local pode ler as suas teclas e o ecrã. Correr a sessão como root multiplica os danos. Ambos são "correcções" para scripts que falham; corrija os scripts.</p>') + `<p>O Wayland é a alternativa moderna; o Handbook cobre o Sway como substituto do i3 em Wayland.</p>`}
  ],
  refs:[['FreeBSD Handbook: O sistema X Window','https://docs.freebsd.org/en/books/handbook/x11/'],['FreeBSD Handbook: Ambientes gráficos','https://docs.freebsd.org/en/books/handbook/desktop/'],['FreeBSD Handbook: Wayland','https://docs.freebsd.org/en/books/handbook/wayland/'],['Guia do utilizador do i3','https://i3wm.org/docs/userguide.html'],['moused(8)','https://man.freebsd.org/cgi/man.cgi?query=moused']],
  quiz:[
   {q:'Que pacote fornece o controlador de entrada libinput para o Xorg?', o:['xf86-input-libinput','xinput-kbd','libinput-tools-x','x11-drivers-all'], a:0, w:'O xf86-input-libinput é o controlador do Xorg que fala com o libinput para ratos, touchpads e teclados.'},
   {q:'Que comando arranca uma sessão X a partir da consola?', o:['startx','xinit-now','x11 start','desktop-start'], a:0, w:'O startx lê o ~/.xinitrc e arranca o servidor X com a sua sessão.'},
   {q:'No i3 e na maioria das configurações X, qual é a tecla Mod4 habitual?', o:['Alt','Ctrl','Super (a tecla Windows ou Command)','Shift'], a:2, w:'Mod4 é a tecla Super. Mod1 é normalmente Alt.'},
   {q:'Porque é má ideia correr xhost +?', o:['Torna a GPU mais lenta','Desliga o controlo de acesso ao X, deixando qualquer cliente local ligar-se e capturar a entrada','Remove tipos de letra','Reinicia o dbus'], a:1, w:'Com o controlo de acesso desligado, qualquer processo local pode ligar-se ao seu servidor X.'}
  ]
},
{ n:8, code:'CH-08', short:'Operações de herói', time:'50 min', title:'Operações de herói: recuperar, medir, provar',
  lead:'O herói não é quem sabe todos os parâmetros. É quem consegue recuperar, medir e provar. Ambientes de arranque, snapshots e scrubs, rastreio e uma lista de verificação repetível.',
  sections:[
  {h:'Ambientes de arranque: a rede de segurança', html:code('sh', `bectl list\nbectl create before-upgrade\nfreebsd-update fetch install        # ou: pkg upgrade -y\nbectl list                          # o novo estado é visível\nbectl activate before-upgrade       # o próximo arranque usa o estado antigo se for preciso`) + note('info','Reverter é uma escolha de arranque','<p>O <code>bectl activate</code> marca um ambiente para o próximo arranque. Mantenha pelo menos um ambiente bom conhecido até o novo provar o seu valor.</p>')},
  {h:'Snapshots, scrubs e replicação', html:code('sh', `zfs snapshot -r zroot@daily-2026-10-19\nzfs list -t snapshot\nzpool scrub zroot                   # verificar todas as somas de blocos, mensalmente\nzpool status zroot                  # acompanhar progresso e erros\nzfs send -R zroot/data@daily-2026-10-19 | ssh backup zfs receive -u backup/bsd01/data`) + note('ok','Pratique o restauro','<p>Uma cópia que nunca restaurou é uma esperança, não uma cópia. Restaure um único ficheiro a partir da réplica uma vez por trimestre.</p>')},
  {h:'Observar a máquina', html:code('sh', `top -SH                # threads e actividade do kernel\nvmstat 1              # memória, paginação e CPU a cada segundo\niostat -x 1           # detalhe de I/O de disco\ngstat -p              # percentagem de ocupação dos discos GEOM`)},
  {h:'DTrace em um minuto', html:`<p>O DTrace está integrado e não precisa de recompilação. Carregue os módulos do provider e faça uma pergunta.</p>` + code('sh', `kldload dtraceall\n# que processos fazem mais chamadas read(2) em cinco segundos\ndtrace -n 'syscall::read:entry { @[execname] = count(); } tick-5s { exit(0); }'`)},
  {h:'Hipervisor: bhyve e vm-bhyve', html:`<p>O bhyve é o hipervisor nativo do FreeBSD. O vm-bhyve é uma interface de gestão que guarda os discos das VMs como datasets ZFS.</p>` + code('sh', `pkg install -y vm-bhyve bhyve-firmware\nzfs create zroot/vm\nsysrc vm_enable="YES"\nsysrc vm_dir="zfs:zroot/vm"\nvm init`) + `<p>Depois siga a documentação do vm-bhyve para criar e instalar hóspedes.</p>`},
  {h:'Automatizar o aborrecido', html:code('conf — /etc/periodic.conf', `daily_status_security_enable="YES"    # relatório de segurança nocturno\ndaily_clean_tmps_enable="YES"`) + `<p>Agende as suas próprias tarefas com <code>crontab -e</code>. Mantenha-as em controlo de versões, não na cabeça.</p>`},
  {h:'A lista de verificação do herói', html:`<ol class="k"><li>Lançamento suportado mais recente, com a data de fim de vida no calendário.</li><li>Utilizador administrador com nome, sudo, SSH só por chave, login de root desligado.</li><li>pf com negação por omissão e retrocesso anti-bloqueio documentado.</li><li>Correcções: freebsd-update, pkg audit, janela de reinício.</li><li>Ambiente de arranque antes de cada mudança arriscada.</li><li>Scrubs e snapshots agendados, com replicação fora da máquina.</li><li>Exercício de restauro feito neste trimestre.</li><li>Jails com limites de recursos e serviços sem privilégios.</li><li>Registos e serviços à escuta revistos periodicamente.</li></ol>`}
  ],
  refs:[['FreeBSD Handbook: ZFS','https://docs.freebsd.org/en/books/handbook/zfs/'],['FreeBSD Handbook: DTrace','https://docs.freebsd.org/en/books/handbook/dtrace/'],['FreeBSD Handbook: Virtualização','https://docs.freebsd.org/en/books/handbook/virtualization/'],['bectl(8)','https://man.freebsd.org/cgi/man.cgi?query=bectl'],['dtrace(1)','https://man.freebsd.org/cgi/man.cgi?query=dtrace'],['periodic(8)','https://man.freebsd.org/cgi/man.cgi?query=periodic']],
  quiz:[
   {q:'Qual é o retrocesso seguro mais rápido para uma actualização falhada?', o:['Reinstalar a partir do DVD','Activar o ambiente de arranque criado antes da actualização','Editar o rc.conf em modo mono-utilizador','Restaurar da memória'], a:1, w:'Um ambiente de arranque anterior à actualização é um alvo de retrocesso instantâneo e bom conhecido.'},
   {q:'Que comando verifica todas as somas de blocos de uma pool ZFS?', o:['zpool scrub','zfs mount -a','zpool import','zfs check'], a:0, w:'Um scrub lê todos os dados e verifica as somas, reparando a partir da redundância quando possível.'},
   {q:'Que hipervisor vem no sistema base do FreeBSD?', o:['VirtualBox','QEMU','bhyve','KVM'], a:2, w:'O bhyve é o hipervisor nativo do FreeBSD e faz parte do sistema base.'},
   {q:'Que sonda dispara quando um programa entra na chamada ao sistema read(2)?', o:['syscall::read:entry','proc:read:start','kernel::read','read:begin'], a:0, w:'O provider syscall expõe sondas de entrada e de retorno para cada chamada ao sistema.'}
  ]
},

const BADS_PT = [
{t:'Trabalhar como root o dia inteiro', d:`Entrar como root para tudo, porque é mais rápido.`, w:`Cada gralha e cada programa comprometido corre com poder total, e não há rasto de auditoria por pessoa. Um atacante que consiga uma shell como o seu utilizador tem de escalar; um fluxo só de root dá-lhe a linha de chegada.`, f:`Um utilizador com nome em wheel, sudo para comandos administrativos e su -l apenas para emergências (Capítulo 2).`},
 {t:'SSH de root com palavras-passe', d:`PermitRootLogin yes e PasswordAuthentication yes, "até as chaves estarem prontas".`, w:`O root é um nome de utilizador conhecido, por isso os bots só precisam de adivinhar uma palavra-passe. A sondagem começa minutos depois de um endereço público aparecer, e as definições temporárias duram anos.`, f:`Chaves para um administrador com nome, PermitRootLogin no, AllowGroups wheel e sshguard para o ruído (Capítulo 3).`},
 {t:'Permitir tudo no pf à socapa', d:`pass in all acrescentado para depurar um problema de ligação.`, w:`As regras temporárias sobrevivem à sessão de depuração. A negação por omissão é o seu controlo principal, e uma regra de permitir tudo elimina-a para todas as portas.`, f:`Acrescente uma regra estreita e registada para o fluxo exacto, teste-a e remova-a. Use o retrocesso anti-bloqueio quando editar por SSH (Capítulo 4).`},
 {t:'Saltar as actualizações porque funciona', d:`O servidor corre, por isso ninguém lhe toca durante um ano.`, w:`As vulnerabilidades no sistema base e nos pacotes são publicadas em avisos e na VuXML. Os atacantes leem as mesmas listas públicas, por isso uma máquina sem correcções é um alvo conhecido.`, f:`Uma janela de manutenção agendada: freebsd-update, pkg audit -F, pkg upgrade, reinício, tudo com um ambiente de arranque (Capítulos 3 e 8).`},
 {t:'Repositórios de terceiros ao acaso e curl | sh', d:`Acrescentar um repositório de pacotes desconhecido ou passar um script de instalação ao sh como root.`, w:`Entrega o root a um mantenedor desconhecido sem revisão. Um repositório ou script comprometido é um ataque à cadeia de fornecimento que passa por cima de tudo o resto que fez.`, f:`O repositório oficial do pkg, a árvore de ports de git.freebsd.org e verificação de somas para tudo o que descarregar à mão.`},
 {t:'chmod 777 para fazer funcionar', d:`Tornar um ficheiro de configuração ou uma directoria gravável por todos para resolver um erro de permissões.`, w:`Qualquer utilizador local, e qualquer serviço que corra como outro utilizador, pode alterá-lo. Uma aplicação web que escreve configuração como 777 transforma um ficheiro num caminho para o root.`, f:`Descubra o dono e o grupo de que o serviço precisa. Use ls -l para verificar, chown e chmod no mínimo e documente a razão.`},
 {t:'Deduplicação ZFS numa máquina modesta', d:`Activar a deduplicação num servidor pequeno porque soa a espaço grátis.`, w:`A tabela de deduplicação tem de viver em RAM para ser rápida. Com pouca memória, o desempenho pode colapsar e a pool torna-se penosa de operar. A deduplicação também multiplica o custo de cada escrita.`, f:`Use compressão lz4, que normalmente dá ganho líquido. Considere a deduplicação só depois de medir dados reais e orçamentar RAM para a tabela.`},
 {t:'RAID é cópia de segurança', d:`Confiar num mirror ou raidz como estratégia de cópia de segurança.`, w:`A redundância protege contra falha de disco. Não protege contra eliminação, ransomware, uma migração mal feita ou um sistema de ficheiros corrompido replicado para todos os discos.`, f:`Snapshots ZFS mais zfs send para uma segunda máquina, com um exercício de restauro por trimestre (Capítulo 8).`},
 {t:'Mexer no kernel na única máquina', d:`Compilar e instalar um kernel próprio no único servidor de produção, sem consola nem ambiente de arranque.`, w:`Um arranque falhado sem retrocesso torna-se uma sessão de salvamento às 3 da manhã. Os erros de kernel são os mais difíceis de desfazer remotamente.`, f:`Compile primeiro numa máquina de teste, mantenha uma consola série ou KVM, crie um ambiente de arranque antes da mudança e guarde o kernel.old (Capítulo 6).`},
 {t:'xhost + e X como root', d:`Abrir o servidor X a todos para um script funcionar e correr a sessão como root.`, w:`Qualquer processo local pode ler as suas teclas e o ecrã. O root multiplica cada erro no ambiente gráfico.`, f:`Corra a sessão como o seu utilizador, mantenha o controlo de acesso ligado e corrija o script em vez do modelo de segurança (Capítulo 7).`},
 {t:'Jails como root, com sockets crus e sem limites', d:`Correr cada serviço como root dentro de uma jail, com privilégios largos e sem limites de recursos.`, w:`Um processo root com sockets crus e sem limites alarga o alcance de um serviço comprometido e deixa um inquilino esfomear os outros. Uma jail é uma camada de contenção, não uma licença para ser descuidado.`, f:`Utilizadores de serviço sem privilégios, as definições allow.* nos valores por omissão, limites de memória e recursos com rctl e um gestor de jails para consistência (Capítulo 5).`}
];

/* ============ language ============ */
let LANG = 'en';
let LEVELS = LEVELS_EN, BADS = BADS_EN, PLATFORMS = PLATFORMS_EN;
const S = () => STR[LANG];

function applyLang(lang){
  LANG = (lang === 'pt') ? 'pt' : 'en';
  LEVELS = LANG === 'pt' ? LEVELS_PT : LEVELS_EN;
  BADS = LANG === 'pt' ? BADS_PT : BADS_EN;
  PLATFORMS = LANG === 'pt' ? PLATFORMS_PT : PLATFORMS_EN;
  document.documentElement.lang = LANG === 'pt' ? 'pt-PT' : 'en';
  document.querySelectorAll('[data-set-lang]').forEach(a => {
    if (a.getAttribute('data-set-lang') === LANG) a.setAttribute('aria-current', 'true');
    else a.removeAttribute('aria-current');
  });
}
document.querySelectorAll('[data-set-lang]').forEach(a => {
  a.addEventListener('click', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button) return;
    ev.preventDefault();
    applyLang(a.getAttribute('data-set-lang'));
    route();
  });
});

/* ============ state ============ */
let progress = load();
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {passed:{}, exam:false}; } catch(e){ return {passed:{}, exam:false}; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch(e){} }
const isPassed = n => !!progress.passed[n];
const isUnlocked = n => n === 0 || isPassed(n-1);
const allPassed = () => LEVELS.every(l => isPassed(l.n));
const passedCount = () => LEVELS.filter(l => isPassed(l.n)).length;

/* ============ navigation ============ */
function renderNav(active){
  const s = S();
  const items = LEVELS.map(l => {
    const st = isPassed(l.n) ? ['done','■'] : isUnlocked(l.n) ? ['open','□'] : ['lock','×'];
    const cls = (active === 'level/'+l.n ? 'on ' : '') + (isUnlocked(l.n) ? '' : 'locked');
    return `<li><a class="${cls}" href="#/level/${l.n}"><span class="st ${st[0]}">${st[1]}</span>${esc(l.code)} · ${esc(l.short)}</a></li>`;
  }).join('');
  const field = [
    ['bad',s.bad], ['platforms',s.platforms], ['exam',s.exam]
  ].map(([k,t]) => `<li><a class="${active===k?'on':''}" href="#/${k}"><span class="st">›</span>${t}</a></li>`).join('');
  document.getElementById('toc').innerHTML =
    `<h4>${s.prog}</h4><div class="bar"><i style="width:${Math.round(passedCount()/LEVELS.length*100)}%"></i></div>
     <div class="muted mono" style="font-size:12px;margin:0 8px 4px">${s.levelsValidated(passedCount(), LEVELS.length)}</div>
     <h4>${s.manual}</h4><ul>${items}</ul><h4>${s.field}</h4><ul>${field}</ul>`;
  document.getElementById('prog-top').textContent = s.top(passedCount(), LEVELS.length) + (progress.exam ? ' · HERO' : '');
}

function route(){
  const h = location.hash.replace(/^#\/?/,'');
  let m;
  if ((m = h.match(/^level\/(\d+)$/))) renderLevel(+m[1]);
  else if (h === 'bad') renderBad();
  else if (h === 'platforms') renderPlatforms();
  else if (h === 'exam') renderExam();
  else if (h === 'manual') { renderIntro(); document.getElementById('view').scrollIntoView(); }
  else renderIntro();
  renderNav(h || 'intro');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* copy buttons */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const txt = b.closest('.codeblock').querySelector('code').textContent;
  try { await navigator.clipboard.writeText(txt); b.textContent = LANG === 'pt' ? 'copiado' : 'copied'; }
  catch(_) { b.textContent = LANG === 'pt' ? 'seleccione' : 'select'; }
  setTimeout(() => b.textContent = LANG === 'pt' ? 'copiar' : 'copy', 1200);
});

/* ============ quiz engine ============ */
function quizHTML(qs){
  const s = S();
  return qs.map((q,i) => `<div class="qitem"><div class="qtext"><span class="qno">Q${i+1}</span>${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,j) => `<button type="button" class="opt" data-qi="${i}" data-oi="${j}">${esc(o)}</button>`).join('')}</div>
    <div class="why" hidden></div></div>`).join('') +
    `<div class="qactions"><button type="button" class="btn primary" data-check>${s.validate}</button>
     <button type="button" class="btn" data-reset>${s.reset}</button><span class="qmsg"></span></div><div class="qextra"></div>`;
}
function mountQuiz(root, qs, threshold, onPass, redo){
  const s = S();
  const sel = qs.map(() => -1);
  let done = false;
  root.innerHTML = quizHTML(qs);
  root.addEventListener('click', e => {
    const opt = e.target.closest('.opt');
    if (opt) {
      if (done) return;
      const qi = +opt.dataset.qi, oi = +opt.dataset.oi;
      sel[qi] = oi;
      root.querySelectorAll(`.opt[data-qi="${qi}"]`).forEach(b => b.classList.toggle('sel', +b.dataset.oi === oi));
      return;
    }
    if (e.target.closest('[data-check]')) check();
    if (e.target.closest('[data-reset]')) redo();
  });
  function check(){
    const msg = root.querySelector('.qmsg');
    if (sel.includes(-1)) { msg.className = 'qmsg warn'; msg.textContent = s.answerAll; return; }
    done = true;
    let score = 0;
    qs.forEach((q,i) => {
      const item = root.querySelectorAll('.qitem')[i];
      item.querySelectorAll('.opt').forEach((b,j) => {
        b.disabled = true;
        if (j === q.a) b.classList.add('ok'); else if (j === sel[i]) b.classList.add('bad');
      });
      const ok = sel[i] === q.a; if (ok) score++;
      const w = item.querySelector('.why');
      w.hidden = false;
      w.innerHTML = `<b class="${ok?'t-ok':'t-bad'}">${ok?s.correct:s.notQuite}</b> ${esc(q.w)}`;
    });
    const pass = score >= threshold;
    msg.className = 'qmsg ' + (pass ? 'ok' : 'bad');
    msg.textContent = s.score(score, qs.length, pass, threshold);
    if (pass) onPass(root.querySelector('.qextra'));
    else root.querySelector('.qextra').innerHTML = `<p class="muted">${s.review}</p>`;
  }
}

/* ============ pages ============ */
function pageHead(code_, title, lead, chips){
  const s = S();
  return `<header class="doc-head">
    <div class="doc-meta"><span>${s.doc}</span><span>${s.chapter} ${esc(code_)}</span><span>${s.revShort} ${REV}</span><span>${s.pub}</span></div>
    <h1><span class="sec">${esc(code_)}</span>${title}</h1>
    <p class="lead">${lead}</p>
    <div class="chips">${chips.map(c=>`<span>${c}</span>`).join('')}</div></header>`;
}

function renderIntro(){
  const s = S();
  const cards = LEVELS.map(l => {
    const stamp = isPassed(l.n) ? `<span class="stamp">${LANG === 'pt' ? 'VALIDADO' : 'VALIDATED'}</span>` : '';
    const lk = isUnlocked(l.n) ? '' : ' lk';
    return `<a class="${lk.trim()}" href="#/level/${l.n}">${stamp}<span class="pg">${esc(l.code)} · p.${(l.n+1)*12}</span><span class="t">${esc(l.title)}</span><span class="s">${esc(l.short)} · ${esc(l.time)}</span></a>`;
  }).join('');
  const next = LEVELS.find(l => !isPassed(l.n)) || LEVELS[0];
  document.getElementById('view').innerHTML = `<article class="page">
    <section class="hero">
      <p class="mono muted" style="margin:0 0 10px">${s.kicker}</p>
      <h1 class="big">${s.heroBig}</h1>
      <p class="sub">${s.heroSub}</p>
      <div class="btns"><a class="btn primary" href="#/level/${next.n}">${passedCount() ? s.cont(esc(next.code)) : s.start}</a>
        <a class="btn" href="#/bad">${s.readBad}</a><a class="btn" href="#/platforms">${s.seePlat}</a>
        <button class="btn danger" type="button" id="reset-prog">${s.resetProg}</button></div>
    </section>
    <table class="tbl" style="max-width:700px"><tbody>
      ${s.rows.map(([k,v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}
    </tbody></table>
    <h2><span class="sec">00</span>${s.toc}</h2>
    <div class="toc">${cards}
      <a href="#/bad"><span class="pg">FN-1</span><span class="t">${s.fn1}</span><span class="s">${s.fn1s}</span></a>
      <a href="#/platforms"><span class="pg">FN-2</span><span class="t">${s.fn2}</span><span class="s">${s.fn2s}</span></a>
      <a href="#/exam"><span class="pg">FN-3</span><span class="t">${s.fn3}</span><span class="s">${s.fn3s}</span></a>
    </div>
    <h2><span class="sec">01</span>${s.how}</h2>
    <ul class="k">
      ${s.howBullets.map(b => `<li>${b}</li>`).join('')}
    </ul>
    ${note('warn', s.beforeTitle, s.beforeBody)}
    <p class="muted" style="font-size:13px;margin-top:40px">${s.trademark}</p>
  </article>`;
  const r = document.getElementById('reset-prog');
  if (r) r.onclick = () => { if (confirm(s.resetConfirm)) { progress = {passed:{}, exam:false}; save(); route(); } };
}

function renderLevel(n){
  const s = S();
  const L = LEVELS[n];
  if (!L) return renderIntro();
  const view = document.getElementById('view');
  if (!isUnlocked(n)) {
    view.innerHTML = `<article class="page">${note('bad', s.lockedTitle, `<p>${s.lockedBody(esc(LEVELS[n-1].code))}</p>`)}
      <div class="btns"><a class="btn primary" href="#/level/${n-1}">${s.goTo(esc(LEVELS[n-1].code))}</a></div></article>`;
    return;
  }
  const secs = L.sections.map((sec,i) => `<section id="s-${i}"><h2><span class="sec">${esc(L.code)}.${i+1}</span>${sec.h}</h2>${sec.html}</section>`).join('');
  const refs = `<section class="refs"><h2><span class="sec">REF</span>${s.refs}</h2><ul>${L.refs.map(([t,u]) => `<li><a href="${u}" target="_blank" rel="noopener noreferrer">${esc(t)}</a> <span class="muted mono" style="font-size:12px">${esc(u)}</span></li>`).join('')}</ul></section>`;
  view.innerHTML = `<article class="page">
    ${pageHead(L.code, esc(L.title), L.lead, [s.est(esc(L.time)), s.valChip, isPassed(n) ? s.statusOk : s.statusOpen])}
    ${secs}${refs}
    <section class="quiz-wrap" id="quiz-sec"><h2 style="border:0;margin-top:0;padding:0"><span class="sec">VAL</span>${s.valHead(esc(L.code))}</h2>
      <p class="muted">${s.valIntro(n<LEVELS.length-1 ? esc(LEVELS[n+1].code) : s.heroExamNext)}</p>
      <div id="quiz"></div></section>
    <nav class="pager">${n>0 ? `<a class="btn" href="#/level/${n-1}">← ${esc(LEVELS[n-1].code)}</a>` : '<span></span>'}
      ${n<LEVELS.length-1 ? `<a class="btn" href="#/level/${n+1}">${esc(LEVELS[n+1].code)} →</a>` : `<a class="btn" href="#/bad">${s.field} →</a>`}</nav>
    <div class="footer">${s.footer(esc(L.code))}</div></article>`;
  mountQuiz(document.getElementById('quiz'), L.quiz, PASS, extra => {
    progress.passed[n] = true; save();
    renderNav('level/'+n);
    extra.innerHTML = `<div class="next-box">${s.validated} ${n<LEVELS.length-1 ? `<a href="#/level/${n+1}">${s.open(esc(LEVELS[n+1].code))}</a>` : (allPassed() ? `<a href="#/exam">${s.fn3} →</a>` : '')}</div>`;
  }, () => renderLevel(n));
}

function renderBad(){
  const s = S();
  const cards = BADS.map((b,i) => `<div class="card"><h3><span class="mono" style="color:var(--accent)">BD-${String(i+1).padStart(2,'0')}</span> ${esc(b.t)}</h3>
    <div class="lbl d">${LANG === 'pt' ? 'A decisão' : 'The decision'}</div><p>${b.d}</p>
    <div class="lbl w">${LANG === 'pt' ? 'Porque é má' : 'Why it is bad'}</div><p>${b.w}</p>
    <div class="lbl f">${LANG === 'pt' ? 'Faça isto em vez disso' : 'Do this instead'}</div><p>${b.f}</p></div>`).join('');
  document.getElementById('view').innerHTML = `<article class="page">
    ${pageHead('FN-1', s.badTitle, s.badLead, s.badChips)}
    <div class="cards">${cards}</div>
    <div class="pager"><a class="btn" href="#/platforms">${s.platforms} →</a></div></article>`;
}

function renderPlatforms(){
  const s = S();
  const cards = PLATFORMS.map(p => `<div class="card"><h3>${esc(p.name)}</h3><span class="tag ${p.tone}">${esc(p.kind)}</span><p>${p.what}</p>
    <p><a href="${p.url}" target="_blank" rel="noopener noreferrer">${LANG === 'pt' ? 'Referência' : 'Reference'} ↗</a></p></div>`).join('');
  document.getElementById('view').innerHTML = `<article class="page">
    ${pageHead('FN-2', s.platTitle, s.platLead, s.platChips)}
    <div class="cards">${cards}</div>
    ${note('info', LANG === 'pt' ? 'Confusão fácil' : 'Easy confusion', s.platNote)}
    <div class="pager"><a class="btn" href="#/exam">${s.exam} →</a></div></article>`;
}

function renderExam(){
  const s = S();
  const view = document.getElementById('view');
  const all = LEVELS.flatMap(l => l.quiz);
  if (!allPassed()) {
    view.innerHTML = `<article class="page">${pageHead('FN-3', s.examTitle || s.fn3, s.examLockedLead, [LANG === 'pt' ? 'Bloqueado' : 'Locked'])}
      ${note('warn', LANG === 'pt' ? 'Bloqueado' : 'Locked', `<p>${s.examLockedBody(passedCount()+'/'+LEVELS.length)}</p>`)}
      <div class="btns"><a class="btn primary" href="#/level/${LEVELS.findIndex(l=>!isPassed(l.n))}">${s.contManual}</a></div></article>`;
    return;
  }
  const qs = shuffle(all).slice(0, 15);
  view.innerHTML = `<article class="page">${pageHead('FN-3', s.fn3, s.examLead(all.length), [LANG === 'pt' ? 'Nota de campo' : 'Field note', LANG === 'pt' ? 'Passar 12/15' : 'Pass 12/15'])}
    <div class="quiz-wrap"><div id="quiz"></div></div></article>`;
  mountQuiz(document.getElementById('quiz'), qs, EXAM_PASS, extra => {
    progress.exam = true; save(); renderNav('exam');
    extra.innerHTML = `<div class="next-box">${s.examPass}</div>`;
  }, renderExam);
}

(function(){ const w = new URLSearchParams(location.search).get('lang'); if (w === 'pt' || w === 'en') { applyLang(w); } })();
window.addEventListener('DOMContentLoaded', route);
if (document.readyState !== 'loading') route();

</script>
