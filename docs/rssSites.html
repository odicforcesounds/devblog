<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Aggregated news titles from dozens of feeds, grouped by category. Click any title to read the original article.">
<title>Monkey Feeds Aggregator</title>
<link rel="stylesheet" href="article.css">
<style>
  :root {
    --bg: #0e1116;
    --bg2: #151a22;
    --bg3: #1c232e;
    --fg: #dfe5ee;
    --fg-dim: #8b95a5;
    --line: #262e3b;
    --accent: #4da3ff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* ---------- header ---------- */
  header.site {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(14, 17, 22, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .site-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  h1 {
    font-size: 19px;
    margin: 0;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  h1 .dot { color: var(--accent); }
  #search {
    flex: 1 1 220px;
    max-width: 420px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--fg);
    font: inherit;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #search:disabled { opacity: 0.5; }
  #global-status {
    margin-left: auto;
    font-size: 13px;
    color: var(--fg-dim);
    white-space: nowrap;
  }

  /* ---------- category nav ---------- */
  nav.cats {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 16px 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-block;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg2);
    color: var(--fg);
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip b { color: var(--accent); font-weight: 600; }

  /* ---------- layout ---------- */
  main { max-width: 1200px; margin: 0 auto; padding: 6px 16px 40px; }
  section.cat { margin: 26px 0; }
  .cat-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .cat-head h2 {
    margin: 0;
    font-size: 21px;
    letter-spacing: 0.2px;
  }
  .cat-meta { font-size: 13px; color: var(--fg-dim); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 10px;
  }
  a.item {
    display: block;
    padding: 10px 12px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--fg);
    text-decoration: none;
    transition: border-color 0.12s ease, transform 0.12s ease, background 0.12s ease;
  }
  a.item:hover {
    border-color: var(--accent);
    background: var(--bg3);
    transform: translateY(-1px);
  }
  a.item .t {
    display: block;
    font-weight: 550;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  a.item .d {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--fg-dim);
  }
  .note {
    font-size: 13px;
    color: var(--fg-dim);
    background: var(--bg2);
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .hidden { display: none !important; }
  button.more {
    grid-column: 1 / -1;
    padding: 10px 12px;
    background: var(--bg2);
    border: 1px dashed var(--line);
    border-radius: 10px;
    color: var(--accent);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  button.more:hover { border-color: var(--accent); background: var(--bg3); }
  footer.site {
    border-top: 1px solid var(--line);
    color: var(--fg-dim);
    font-size: 13px;
  }
  footer.site > div { max-width: 1200px; margin: 0 auto; padding: 16px; }
  footer.site a { color: var(--accent); text-decoration: none; }
  footer.site a:hover { text-decoration: underline; }
  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    #global-status { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <h1>Fruity and Delicious News</h1>
    <span id="search" type="search" placeholder="Filter titles…" disabled autocomplete="off"></span>
    <span id="global-status">Loading…</span>
  </div>
  <nav class="cats" id="cat-nav"></nav>
</header>

<div class="textbox black">
<main id="app"></main>
</div> 
<footer class="site">
      <a href="index.html">
        Home
      </a>
</footer>

<script>
/* ================= DATA (injected by build) ================= */
window.FEED_DATA = {"Activism":["https://proton.me/blog/feed.xml","https://unicornriot.ninja/feed/","https://tuta.com/blog/feed.xml"],"BSD":["https://www.adyxax.org/blog/index.xml","https://www.tumfatig.net/index.xml","https://www.osnews.com/feed/","https://feeds.fireside.fm/bsdnow/rss","https://freebsdfoundation.org/feed/","https://www.cambus.net/atom.xml","https://undeadly.org/cgi?action=rss","https://blog.jrehkemper.de/index.xml","https://dataswamp.org/~solene/rss.xml","https://drewdevault.com/blog/index.xml","https://artixlinux.org/feed.php","https://aswinc.blog/index.xml","https://www.zacbrown.org/posts/feed.rss","https://www.sinankurtulmus.net/rss.xml"],"Coding":["https://blog.codepen.io/feed/","https://css-tricks.com/feed/","https://code.tutsplus.com/posts.atom","https://feeds2.feedburner.com/webdesignerdepot","https://speckyboy.com/feed/","https://tympanus.net/codrops/feed/","https://alistapart.com/main/feed/","https://blog.drhack.net/feed/"],"Hacking":["https://www.hackers-arise.com/blog-feed.xml","https://latesthackingnews.com/feed/","https://www.linuxlinks.com/feed","https://blog.ostorlab.co/feed/rss.xml"],"Security":["https://developers.cloudflare.com/changelog/rss/index.xml","https://www.qubes-os.org/feed.xml","https://discourse.nixos.org/c/links.rss","https://linuxvox.com/rss.xml","https://www.linuxtechmore.com/feed","https://adsecurity.org/?feed=rss2","https://cqureacademy.com/feed","https://dfir.blog/rss/","https://medium.com/feed/@Cyb3rWard0g","https://ponderthebits.com/feed/","https://www.us-cert.gov/ncas/alerts.xml","https://www.welivesecurity.com/category/cybercrime,malware,cybersecurity,password,scams,vulnerability,mobile-security,threat-reports/feed/","https://www.zerodayinitiative.com/blog?format=rss","https://raymii.org/s/feed.xml","https://www.proteansec.com/blog/feed/all.rss.xml"],"Linux":["https://fossforce.com/feed/","https://forgejo.org/rss.xml","https://www.transparenthands.org/feed/","https://www.trackawesomelist.com/rss.xml","https://pub.dev/feed.atom","https://www.misp-lea.org/feed.xml"]};

/* ================= app ================= */
(function () {
  'use strict';

  var PER_FEED_ITEMS = 25;   // max titles kept per feed
  var WORKERS = 5;           // parallel feed fetches (keep low: free proxy tiers rate-limit)
  var FETCH_TIMEOUT = 9000;  // ms per proxy attempt
  var LOAD_DEADLINE_MS = 300000; // hard stop: skip sources still pending after this
  var RENDER_CAP = 3000;     // cards rendered per category; "Show all" reveals the rest

  // Optional runtime overrides via URL, e.g. index.html?workers=8&deadline=600000
  (function applyUrlParams() {
    var qp;
    try { qp = new URLSearchParams(location.search); } catch (e) { return; }
    var v;
    if ((v = parseInt(qp.get('workers'), 10)) > 0) WORKERS = Math.min(v, 16);
    if ((v = parseInt(qp.get('deadline'), 10)) > 0) LOAD_DEADLINE_MS = v;
  })();
  var RENDER_MIN_MS = 1500;  // min interval between re-renders of one category

  var data = window.FEED_DATA;

  var app = document.getElementById('app');
  var nav = document.getElementById('cat-nav');
  var statusEl = document.getElementById('global-status');
  var searchEl = document.getElementById('search');
  var footEl = document.getElementById('foot-stats');

  var catNames = Object.keys(data);
  var catState = {};   // name -> {items:[], ok:0, failed:0, total:0, loaded:false}
  var doneCount = 0, totalCount = 0;

  /* ---------- helpers ---------- */

  function decodeEntities(s) {
    var t = document.createElement('textarea');
    t.innerHTML = s;
    return t.value;
  }
  function cleanTitle(s) {
    if (!s) return '';
    s = String(s).replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1');
    s = decodeEntities(s);
    s = decodeEntities(s); // some feeds ship double-escaped entities (&amp;#8217;)
    return s.replace(/\s+/g, ' ').trim();
  }
  function childText(el, names) {
    for (var i = 0; i < names.length; i++) {
      var kids = el.getElementsByTagName(names[i]);
      if (kids.length && kids[0].textContent) return kids[0].textContent.trim();
    }
    return '';
  }
  function childByLocal(el, local) {
    var kids = el.children;
    for (var i = 0; i < kids.length; i++) {
      if (kids[i].localName === local && kids[i].textContent) return kids[i].textContent.trim();
    }
  }
  function parseDate(s) {
    if (!s) return null;
    var t = Date.parse(s);
    return isNaN(t) ? null : t;
  }
  function fmtDate(ms) {
    try { return new Date(ms).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
    catch (e) { return ''; }
  }
  function withTimeout(ms) {
    var c = new AbortController();
    var timer = setTimeout(function () { c.abort(); }, ms);
    return { signal: c.signal, cancel: function () { clearTimeout(timer); } };
  }

  /* ---------- parsing ---------- */

  function parseFeedXml(text, sourceUrl) {
    var doc = null;
    try { doc = new DOMParser().parseFromString(text, 'text/xml'); } catch (e) {}
    if (!doc || doc.getElementsByTagName('parsererror').length) {
      try { doc = new DOMParser().parseFromString(text, 'text/html'); } catch (e2) {}
      if (!doc) return [];
    }
    var entries = doc.getElementsByTagName('item');
    if (!entries.length) entries = doc.getElementsByTagName('entry');
    var out = [];
    for (var i = 0; i < entries.length && out.length < PER_FEED_ITEMS; i++) {
      var e = entries[i];
      var title = cleanTitle(childText(e, ['title']));
      if (!title) continue;
      var link = '';
      var linkEl = e.getElementsByTagName('link')[0];
      if (linkEl) {
        link = (linkEl.getAttribute && linkEl.getAttribute('href')) || linkEl.textContent || '';
      }
      if (!link) {
        var g = e.getElementsByTagName('guid')[0];
        if (g && (g.getAttribute('isPermaLink') !== 'false')) link = g.textContent || '';
      }
      try { if (link) link = new URL(link, sourceUrl).toString(); } catch (err) { link = ''; }
      if (!link) continue;
      var date = parseDate(childText(e, ['pubDate', 'published', 'updated'])) ||
                 parseDate(childByLocal(e, 'date'));
      out.push({ title: title, link: link, date: date });
    }
    return out;
  }

  function discoverFeedUrl(html, baseUrl) {
    var doc;
    try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { return null; }
    var links = doc.querySelectorAll('link');
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var rel = (l.getAttribute('rel') || '').toLowerCase();
      if (rel.indexOf('alternate') === -1) continue;
      var type = (l.getAttribute('type') || '').toLowerCase();
      var href = l.getAttribute('href');
      if (!href) continue;
      if (type.indexOf('rss') > -1 || type.indexOf('atom') > -1 || type.indexOf('xml') > -1 ||
          (!type && /feed|rss|atom|xml/i.test(href))) {
        try { return new URL(href, baseUrl).toString(); } catch (e) {}
      }
    }
    return null;
  }

  /* ---------- fetching (rss2json first, raw proxies as fallback) ---------- */

  function fetchViaRss2json(url) {
    // NOTE: the free (keyless) rss2json API rejects the `count` parameter.
    var api = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(url);
    var to = withTimeout(FETCH_TIMEOUT);
    return fetch(api, { signal: to.signal })
      .then(function (r) { if (!r.ok) throw new Error('http-' + r.status); return r.json(); })
      .then(function (j) {
        to.cancel();
        if (!j || j.status !== 'ok' || !j.items || !j.items.length) throw new Error('rss2json-empty');
        var items = [];
        for (var i = 0; i < j.items.length && items.length < PER_FEED_ITEMS; i++) {
          var it = j.items[i];
          var title = cleanTitle(it.title || '');
          if (!title || !it.link) continue;
          items.push({ title: title, link: it.link, date: parseDate(it.pubDate || '') });
        }
        if (!items.length) throw new Error('rss2json-empty');
        return items;
      }, function (e) { to.cancel(); throw e; });
  }

  function fetchViaRawProxy(url, proxy) {
    var to = withTimeout(FETCH_TIMEOUT);
    return fetch(proxy + encodeURIComponent(url), { signal: to.signal })
      .then(function (r) {
        if (!r.ok) throw new Error('proxy-http-' + r.status);
        return r.text();
      })
      .then(function (text) {
        to.cancel();
        var trimmed = (text || '').replace(/^\uFEFF/, '').trim();
        if (trimmed.charAt(0) === '<') {
          var items = parseFeedXml(text, url);
          if (items.length) return items;
          var found = discoverFeedUrl(text, url);
          if (found && found !== url) return fetchViaRss2json(found);
          throw new Error('no-feed-found');
        }
        throw new Error('proxy-non-xml');
      }, function (e) { to.cancel(); throw e; });
  }

  function fetchFeed(url) {
    // Try several public CORS-friendly gateways; a feed only needs one to answer.
    return fetchViaRss2json(url)
      .catch(function () {
        return fetchViaRawProxy(url, 'https://api.allorigins.win/raw?url=');
      })
      .catch(function () {
        return fetchViaRawProxy(url, 'https://api.codetabs.com/v1/proxy?quest=');
      })
      .catch(function () {
        return fetchViaRawProxy(url, 'https://api.cors.lol/?url=');
      });
  }

  /* ---------- rendering ---------- */

  function buildSkeleton() {
    for (var i = 0; i < catNames.length; i++) {
      var name = catNames[i];
      catState[name] = {
        items: [], ok: 0, failed: 0,
        total: data[name].length, loaded: false, el: null, list: null, meta: null
      };
      var sec = document.createElement('section');
      sec.className = 'cat';
      sec.id = 'cat-' + i;
      var head = document.createElement('div');
      head.className = 'cat-head';
      var h2 = document.createElement('h2');
      h2.textContent = name;
      var meta = document.createElement('span');
      meta.className = 'cat-meta';
      meta.textContent = 'loading ' + catState[name].total + ' sources…';
      head.appendChild(h2);
      head.appendChild(meta);
      var grid = document.createElement('div');
      grid.className = 'grid';
      sec.appendChild(head);
      sec.appendChild(grid);
      app.appendChild(sec);
      catState[name].el = sec;
      catState[name].list = grid;
      catState[name].meta = meta;

      var chip = document.createElement('a');
      chip.className = 'chip';
      chip.href = '#cat-' + i;
      chip.innerHTML = name.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
        ' <b>0</b>';
      chip._cat = name;
      nav.appendChild(chip);
    }
  }

  function renderCat(name) {
    var st = catState[name];
    if (!st) return;
    st.list.innerHTML = '';

    st.items.sort(function (a, b) {
      return (b.date || 0) - (a.date || 0) || (a.title < b.title ? -1 : 1);
    });

    var frag = document.createDocumentFragment();
    var cap = st.cap || RENDER_CAP;
    var shown = Math.min(cap, st.items.length);
    for (var i = 0; i < shown; i++) {
      var it = st.items[i];
      var a = document.createElement('a');
      a.className = 'item';
      a.href = it.link;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = it.title;
      a.appendChild(t);
      if (it.date) {
        var d = document.createElement('span');
        d.className = 'd';
        d.textContent = fmtDate(it.date);
        a.appendChild(d);
      }
      frag.appendChild(a);
    }
    if (st.items.length > shown) {
      var more = document.createElement('button');
      more.className = 'more';
      more.type = 'button';
      more.textContent = 'Show all ' + st.items.length + ' articles';
      more.addEventListener('click', function () {
        st.cap = st.items.length;
        renderCat(name);
      });
      frag.appendChild(more);
    }
    st.list.appendChild(frag);

    var bits = [];
    bits.push(st.items.length + ' articles · ' + st.ok + '/' + st.total + ' sources');
    if (st.failed > 0) bits.push(st.failed + ' unavailable');
    st.meta.textContent = bits.join(' · ');

    var chips = nav.children;
    for (var c = 0; c < chips.length; c++) {
      if (chips[c]._cat === name) {
        chips[c].innerHTML =
          name.replace(/&/g, '&amp;').replace(/</g, '&lt;') +
          ' <b>' + st.items.length + '</b>';
      }
    }

    if (st.failed > 0) {
      var note = document.createElement('p');
      note.className = 'note';
      note.textContent = st.failed + ' of ' + st.total + ' sources in this category did not respond and were skipped.';
      st.el.appendChild(note);
    }
    if (!st.items.length && st.loaded) {
      var p = document.createElement('p');
      p.className = 'note';
      p.textContent = 'No articles available from this category right now.';
      st.el.appendChild(p);
    }
  }

  /* ---------- search filter ---------- */

  function applyFilter() {
    var q = (searchEl.value || '').toLowerCase().trim();
    var sections = app.children;
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      var items = sec.querySelectorAll('a.item');
      var visible = 0;
      for (var j = 0; j < items.length; j++) {
        var hit = !q || items[j].textContent.toLowerCase().indexOf(q) > -1;
        items[j].classList.toggle('hidden', !hit);
        if (hit) visible++;
      }
      var head = sec.querySelector('.cat-head');
      if (head) head.classList.toggle('hidden', q && visible === 0);
      var notes = sec.querySelectorAll('.note');
      for (var k = 0; k < notes.length; k++) notes[k].classList.toggle('hidden', !!q);
      sec.classList.toggle('hidden', q && visible === 0);
    }
  }

  /* ---------- loading pipeline ---------- */

  var queue = [];
  for (var ci = 0; ci < catNames.length; ci++) {
    var urls = data[catNames[ci]];
    for (var ui = 0; ui < urls.length; ui++) queue.push({ cat: catNames[ci], url: urls[ui] });
  }
  totalCount = queue.length;

  function tickStatus() {
    statusEl.textContent = 'Loading ' + doneCount + '/' + totalCount + ' sources…';
  }

  // Skip whatever is still queued after the deadline so the page always finishes.
  var skippedByDeadline = 0;
  var t0 = Date.now();
  function enforceDeadline() {
    if (Date.now() - t0 < LOAD_DEADLINE_MS || !queue.length) return;
    skippedByDeadline = queue.length;
    while (queue.length) {
      var task = queue.shift();
      var st = catState[task.cat];
      if (st) st.failed++;
      doneCount++;
    }
    statusEl.textContent = 'Loading… (skipping slow sources)';
  }
  setInterval(enforceDeadline, 2000);

  function processOne(task) {
    return fetchFeed(task.url)
      .then(function (items) {
        var st = catState[task.cat];
        if (!st) return;
        st.ok++;
        for (var i = 0; i < items.length; i++) st.items.push(items[i]);
      })
      .catch(function () {
        var st = catState[task.cat];
        if (st) st.failed++;
      })
      .then(function () {
        doneCount++;
        var st = catState[task.cat];
        if (st) {
          var now = Date.now();
          if (!st.loaded) {
            st.loaded = true;
            renderCat(task.cat);
            st.lastRender = now;
          } else if (now - (st.lastRender || 0) >= RENDER_MIN_MS) {
            renderCat(task.cat);
            st.lastRender = now;
          } else {
            st.dirty = true; // rendered later, at finish()
          }
        }
        tickStatus();
        if (doneCount === totalCount) finish();
      });
  }

  function worker() {
    if (!queue.length || Date.now() - t0 >= LOAD_DEADLINE_MS) return;
    var task = queue.shift();
    processOne(task).then(worker);
  }

  function finish() {
    statusEl.textContent = 'Loaded ' + doneCount + '/' + totalCount + ' sources' +
      (skippedByDeadline ? ' (' + skippedByDeadline + ' too slow, skipped)' : '');
    for (var name in catState) {
      if (catState[name].dirty) {
        catState[name].dirty = false;
        renderCat(name);
      }
    }
    searchEl.disabled = false;
    var chips = nav.children;
    for (var i = 0; i < chips.length; i++) {
      var st = catState[chips[i]._cat];
      if (st && st.items.length === 0) chips[i].classList.add('hidden');
    }
    var totalItems = 0, totalOk = 0;
    for (var name in catState) {
      totalItems += catState[name].items.length;
      totalOk += catState[name].ok;
    }
    footEl.textContent = 'Showing ' + totalItems + ' articles from ' + totalOk + ' of ' +
      totalCount + ' sources.';
  }

  buildSkeleton();
  tickStatus();
  var filterTimer = null;
  searchEl.addEventListener('input', function () {
    if (filterTimer) clearTimeout(filterTimer);
    filterTimer = setTimeout(applyFilter, 200); // debounce: can be 100k+ cards
  });
  for (var w = 0; w < Math.min(WORKERS, queue.length); w++) worker();
})();
</script>
</body>
</html>
