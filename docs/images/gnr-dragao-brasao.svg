<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 540" role="img" aria-labelledby="title desc">
  <title id="title">Brasão estilizado da Guarda Nacional Republicana</title>
  <desc id="desc">Escudo verde com uma espada antiga dourada ao centro e dois dragões afrontados, um de cada lado; divisa Pela Lei e Pela Grei.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6df9a"/>
      <stop offset=".4" stop-color="#d9b45b"/>
      <stop offset=".72" stop-color="#9b7424"/>
      <stop offset="1" stop-color="#f0d28a"/>
    </linearGradient>
    <linearGradient id="goldVert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6df9a"/>
      <stop offset=".55" stop-color="#c69b3c"/>
      <stop offset="1" stop-color="#8a6520"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#0e2d24"/>
      <stop offset=".52" stop-color="#081c16"/>
      <stop offset="1" stop-color="#040b09"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76828d"/>
      <stop offset=".38" stop-color="#eaf2f8"/>
      <stop offset=".55" stop-color="#c5d1db"/>
      <stop offset="1" stop-color="#5f6a74"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".58">
      <stop offset="0" stop-color="#d9b45b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#d9b45b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="230" cy="260" r="205" fill="url(#glow)"/>
  <circle cx="230" cy="260" r="192" fill="none" stroke="#d9b45b" stroke-opacity=".17" stroke-dasharray="1 9" stroke-width="1.3"/>

  <!-- shield -->
  <path d="M230 58 392 114v142c0 111-71 182-162 218C139 438 68 367 68 256V114Z" fill="url(#shield)" stroke="url(#gold)" stroke-width="3"/>
  <path d="M230 76 375 126v128c0 99-62 163-145 197-83-34-145-98-145-197V126Z" fill="none" stroke="#d9b45b" stroke-opacity=".38" stroke-width="1"/>

  <!-- field texture -->
  <g stroke="#d9b45b" stroke-opacity=".05" stroke-width="1" fill="none">
    <path d="M102 196c43-27 82-27 128 0s85 27 128 0"/>
    <path d="M102 222c43-27 82-27 128 0s85 27 128 0"/>
    <path d="M102 248c43-27 82-27 128 0s85 27 128 0"/>
    <path d="M102 274c43-27 82-27 128 0s85 27 128 0"/>
    <path d="M108 300c40-24 77-24 122 0s82 24 122 0"/>
    <path d="M116 326c36-21 70-21 114 0s78 21 114 0"/>
  </g>

  <!-- left dragon -->
  <g>
    <path d="M126 226C106 202 84 206 80 232c18-2 26 10 23 25 14-10 24-12 36-8" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M150 220c-30 26-38 67-18 98 15 24 45 28 61 9" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M193 327c18-15 23-35 13-50" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(0,14)">
      <path d="M143 199c10-14 30-14 40-2 7 9 5 21-4 28l-12 8-18-6-10-13z" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1.5"/>
      <path d="M180 207l20-5-4 10-14 3" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1.2"/>
      <path d="M178 220l17 4" fill="none" stroke="#7a5a17" stroke-width="1.5"/>
      <path d="M150 190l-7-18 11 4 6 13M160 187l2-18 8 9-1 12" fill="none" stroke="#d9b45b" stroke-width="2.2"/>
      <circle cx="167" cy="202" r="2.3" fill="#e35c45"/>
    </g>
    <path d="M121 292l-20 10M126 298l-17 14M154 341l-7 20M166 340l6 19" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 260c7 5 12 11 15 18M140 248c6 4 11 9 15 15" fill="none" stroke="#d9b45b" stroke-opacity=".55" stroke-width="1.2"/>
  </g>

  <!-- right dragon (mirror) -->
  <g transform="translate(460,0) scale(-1,1)">
    <path d="M126 226C106 202 84 206 80 232c18-2 26 10 23 25 14-10 24-12 36-8" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M150 220c-30 26-38 67-18 98 15 24 45 28 61 9" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M193 327c18-15 23-35 13-50" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(0,14)">
      <path d="M143 199c10-14 30-14 40-2 7 9 5 21-4 28l-12 8-18-6-10-13z" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1.5"/>
      <path d="M180 207l20-5-4 10-14 3" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1.2"/>
      <path d="M178 220l17 4" fill="none" stroke="#7a5a17" stroke-width="1.5"/>
      <path d="M150 190l-7-18 11 4 6 13M160 187l2-18 8 9-1 12" fill="none" stroke="#d9b45b" stroke-width="2.2"/>
      <circle cx="167" cy="202" r="2.3" fill="#e35c45"/>
    </g>
    <path d="M121 292l-20 10M126 298l-17 14M154 341l-7 20M166 340l6 19" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M128 260c7 5 12 11 15 18M140 248c6 4 11 9 15 15" fill="none" stroke="#d9b45b" stroke-opacity=".55" stroke-width="1.2"/>
  </g>

  <!-- sword: hilt at top, blade down -->
  <g>
    <path d="M230 176 239 191v184l-9 30-9-30V191Z" fill="url(#blade)" stroke="#58636d" stroke-width="1"/>
    <path d="M230 182v204" stroke="#f4f8fb" stroke-opacity=".58" stroke-width="1.1"/>
    <path d="M230 405l-9 16 9 13 9-13Z" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1"/>
    <rect x="166" y="164" width="128" height="9" rx="4.5" fill="url(#gold)" stroke="#7a5a17" stroke-width="1"/>
    <path d="M178 160c-7 5-10 12-9 19M282 160c7 5 10 12 9 19" fill="none" stroke="#d9b45b" stroke-width="2"/>
    <rect x="214" y="118" width="32" height="52" rx="6" fill="#2a2010" stroke="url(#gold)" stroke-width="3"/>
    <path d="M217 129h26M217 140h26M217 151h26" stroke="#d9b45b" stroke-opacity=".55" stroke-width="1"/>
    <circle cx="230" cy="108" r="15" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1.5"/>
    <circle cx="230" cy="108" r="5.5" fill="#0b1512" stroke="#f6df9a" stroke-opacity=".7" stroke-width="1"/>
  </g>

  <!-- ribbon -->
  <g>
    <path d="M66 448c34-9 66-10 98-2l66 17 66-17c32-8 64-7 98 2l-17 27c-29-8-56-7-82 1l-65 17-65-17c-26-8-53-9-82-1Z" fill="#0b1a15" stroke="url(#gold)" stroke-width="2"/>
    <path d="M86 460c27-5 51-3 74 4M374 460c-27-5-51-3-74 4" fill="none" stroke="#d9b45b" stroke-opacity=".42" stroke-width="1"/>
    <path d="M196 469h21M243 469h21" stroke="#d9b45b" stroke-opacity=".65" stroke-width="1.2"/>
    <path d="M230 461l9 9-9 9-9-9Z" fill="url(#goldVert)" stroke="#7a5a17" stroke-width="1"/>
  </g>
</svg>
