<script>
(function () {
  "use strict";

  var root = document.getElementById("catalogue");
  var statline = document.getElementById("statline");
  var catalogue = new Map();   // category key -> fetched data
  var drawn = new Set();       // every href already on the page

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function num(n) {
    return n > 999 ? n.toLocaleString("en-GB") : String(n);
  }

  function once(href) {
    if (drawn.has(href)) return false;
    drawn.add(href);
    return true;
  }

  function link(href, text, cls) {
    var a = el("a", cls, text);
    a.href = href;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }

  function count(n, one, many) {
    return num(n) + " " + (n === 1 ? one : many);
  }

  function card(tool) {
    var box = el("details", "tool");
    var head = el("summary");
    head.appendChild(el("span", "n", String(tool.i).padStart(2, "0")));
    head.appendChild(el("span", "tn", tool.n));
    head.appendChild(el("span", "host", tool.h || ""));
    box.appendChild(head);

    var body = el("div", "card");
    var what = el("p", "d", tool.d || "");
    if (!tool.d) {
      what.className = "d muted";
      what.textContent = "The list gives no description — the link is the description.";
    }
    body.appendChild(what);

    if (tool.x) {
      var pre = el("pre");
      var code = el("code");
      var prompt = el("span", "p", "$");
      code.appendChild(prompt);
      code.appendChild(document.createTextNode(" " + tool.x));
      pre.appendChild(code);
      body.appendChild(pre);
    } else if (tool.y) {
      body.appendChild(el("p", "note-line", tool.y));
    }

    if (tool.a && tool.a.length) {
      body.appendChild(el("p", "also", "also listed in " + tool.a.join(", ")));
    }

    if (once(tool.u)) {
      var src = el("p", "src");
      src.appendChild(link(tool.u, "open the source →"));
      body.appendChild(src);
    }
    box.appendChild(body);
    return box;
  }

  function drawer(part) {
    var box = el("details", "drawer");
    var head = el("summary");
    head.appendChild(document.createTextNode(part.t));
    head.appendChild(el("span", "count", count(part.c.length, "tool", "tools")));
    box.appendChild(head);

    var body = el("div", "drawer-body");
    var painted = false;
    box.addEventListener("toggle", function () {
      if (!box.open || painted) return;
      painted = true;
      var frag = document.createDocumentFragment();
      part.c.forEach(function (tool) { frag.appendChild(card(tool)); });
      body.appendChild(frag);
    });
    box.appendChild(body);
    return box;
  }

  function list(item) {
    var box = el("details", "list");
    var head = el("summary");
    head.appendChild(el("span", "tn", item.n));
    head.appendChild(el("span", "count", count(item.c, "tool", "tools")));
    box.appendChild(head);

    var body = el("div", "list-body");
    if (item.w) body.appendChild(el("p", "what", item.w));

    if (once(item.u)) {
      var src = el("p", "repo");
      src.appendChild(link(item.u, "github.com/" + item.r + " →"));
      body.appendChild(src);
    }

    if (item.toc) {
      var toc = el("details", "toc");
      var tocHead = el("summary");
      tocHead.textContent = count(item.toc.n, "section", "sections") + " · " +
                            count(item.toc.e, "linked entry", "linked entries");
      toc.appendChild(tocHead);
      toc.appendChild(el("p", null, item.toc.names.join(" · ")));
      body.appendChild(toc);
    }

    item.d.forEach(function (part) { body.appendChild(drawer(part)); });
    box.appendChild(body);
    return box;
  }

  function paint(cat, body, data) {
    var frag = document.createDocumentFragment();
    data.lists.forEach(function (item) { frag.appendChild(list(item)); });
    body.appendChild(frag);
    body.dataset.painted = "1";
  }

  function load(cat, body) {
    if (body.dataset.painted) return;
    if (body.dataset.loading) return;
    body.dataset.loading = "1";

    var note = el("p", "loading", "opening " + cat.slug + ".json …");
    body.appendChild(note);

    var cached = catalogue.get(cat.key);
    if (cached) {
      note.remove();
      paint(cat, body, cached);
      return;
    }

    fetch("awesome/data/" + cat.slug + ".json", { credentials: "same-origin" })
      .then(function (res) {
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        return res.json();
      })
      .then(function (data) {
        catalogue.set(cat.key, data);
        note.remove();
        paint(cat, body, data);
      })
      .catch(function (err) {
        note.className = "fail";
        note.textContent = "Could not load awesome/data/" + cat.slug + ".json (" + err.message + ").";
      });
  }

  function category(cat) {
    var box = el("details", "cat");
    box.id = "cat-" + cat.key;

    var head = el("summary", "cat-head");
    head.appendChild(el("span", "num", cat.num));
    head.appendChild(el("span", null, cat.title));
    head.appendChild(el("span", "count",
      count(cat.lists, "list", "lists") + " · " + count(cat.tools, "tool", "tools")));
    box.appendChild(head);

    var body = el("div", "cat-body");
    body.appendChild(el("p", "blurb", cat.blurb));
    box.appendChild(body);

    box.addEventListener("toggle", function () {
      if (box.open) load(cat, body);
    });
    return box;
  }

  fetch("awesome/data/index.json", { credentials: "same-origin" })
    .then(function (res) {
      if (!res.ok) throw new Error(res.status + " " + res.statusText);
      return res.json();
    })
    .then(function (data) {
      statline.innerHTML = "";
      statline.appendChild(el("b", null, num(data.lists)));
      statline.appendChild(document.createTextNode(" lists · "));
      statline.appendChild(el("b", null, num(data.tools)));
      statline.appendChild(document.createTextNode(" tools · "));
      statline.appendChild(el("b", null, num(data.drawers)));
      statline.appendChild(document.createTextNode(" drawers · four levels"));

      var frag = document.createDocumentFragment();
      data.categories.forEach(function (cat) { frag.appendChild(category(cat)); });
      root.appendChild(frag);

      var wanted = location.hash.replace(/^#/, "");
      if (wanted) {
        var target = document.getElementById("cat-" + wanted);
        if (target) {
          target.open = true;
          target.scrollIntoView();
        }
      }
    })
    .catch(function (err) {
      statline.className = "fail";
      statline.textContent = "Could not load awesome/data/index.json (" + err.message + ").";
    });
})();
</script>
