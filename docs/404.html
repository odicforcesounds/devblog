<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page not found — Monkey Blog</title>
  <meta name="description" content="This address does not exist on Monkey Blog. Search the archive to find the page you were looking for.">
  <link rel="icon" href="/favicon.ico" type="image/x-icon" sizes="12x12" />
  <style>
    :root {
      --ink: #e9f2f9;
      --muted: #94a7bc;
      --accent: #54e3c4;
      --accent-warm: #ffbe6b;
      --line: rgba(133, 170, 199, 0.18);
      --line-strong: rgba(84, 227, 196, 0.45);
      --panel: rgba(12, 17, 24, 0.82);
      --panel-soft: rgba(18, 24, 33, 0.76);
      --radius: 0.9rem;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html { margin: 0; background: #04070b; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 3rem 1.25rem;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.55;
      background:
        radial-gradient(1000px 480px at 15% -10%, rgba(84, 227, 196, 0.13), transparent 62%),
        radial-gradient(860px 420px at 85% 6%, rgba(255, 190, 107, 0.1), transparent 60%),
        #04070b;
    }

    .wrap {
      width: min(680px, 100%);
      margin: 0 auto;
    }

    .brand {
      display: inline-block;
      margin-bottom: 1.6rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
    }

    .brand:hover { color: var(--accent); }

    .code {
      font-family: var(--mono);
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: var(--accent-warm);
    }

    h1 {
      margin: 0.4rem 0 0.8rem;
      font-size: clamp(1.6rem, 5vw, 2.3rem);
      line-height: 1.15;
      background-image: linear-gradient(92deg, #dcefff 0%, var(--accent) 52%, var(--accent-warm) 100%);
      background-clip: text;
    }

    p.lede {
      margin: 0 0 1.4rem;
      color: var(--muted);
    }

    form.search {
      display: flex;
      gap: 0.6rem;
      margin: 0 0 0.8rem;
    }

    label.sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    input[type="search"] {
      flex: 1 1 auto;
      padding: 0.7rem 0.85rem;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.9rem;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
    }

    input[type="search"]:focus {
      outline: none;
      border-color: var(--line-strong);
    }

    button {
      padding: 0.7rem 1.05rem;
      color: #04110d;
      font-family: var(--mono);
      font-size: 0.88rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), #008866);
      border: 1px solid transparent;
      border-radius: 0.6rem;
      cursor: pointer;
    }

    .status {
      min-height: 1.4em;
      margin: 0.5rem 0 0;
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .status[data-tone="error"] { color: #ff9c9c; }

    ul.hits {
      margin: 0.8rem 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 0.5rem;
    }

    ul.hits li {
      padding: 0.7rem 0.85rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
    }

    ul.hits a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.95rem;
    }

    ul.hits a:hover { color: var(--accent); }

    ul.hits .meta {
      display: block;
      margin-top: 0.15rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    nav.links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.2rem;
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    nav.links a { color: var(--accent); text-decoration: none; }
    nav.links a:hover { color: var(--accent-warm); }
  </style>
</head>

<body>
  <div class="wrap">
    <a class="brand" href="/">Monkey Blog</a>

    <div class="code">404</div>
    <h1>This page is not here</h1>
    <p class="lede">
      The address you asked for does not exist — a moved page, a broken link, or a typo.
      The archive is still searchable.
    </p>

    <form class="search" id="find" role="search" autocomplete="off">
      <label class="sr" for="q">Search the articles</label>
      <input id="q" name="q" type="search" placeholder="Search the articles…" spellcheck="false">
      <button type="submit">Search</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <ul class="hits" id="hits" hidden></ul>

    <nav class="links" aria-label="Where to go next">
      <a href="/">Blog index</a>
      <a href="/sitemap.xml">Sitemap</a>
    </nav>
  </div>

  <script type="module">
    import * as API from "/api.js";

    const form = document.getElementById("find");
    const input = document.getElementById("q");
    const status = document.getElementById("status");
    const hits = document.getElementById("hits");

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const query = input.value.trim();
      hits.replaceChildren();
      if (!query) {
        status.textContent = "";
        hits.hidden = true;
        return;
      }
      status.removeAttribute("data-tone");
      status.textContent = "Searching…";
      API.searchFull(query, { limit: 6 }).then(function (matches) {
        hits.hidden = matches.length === 0;
        if (!matches.length) {
          status.textContent = "Nothing matched “" + query + "”.";
          return;
        }
        status.textContent = matches.length + " match" + (matches.length === 1 ? "" : "es");
        const fragment = document.createDocumentFragment();
        matches.forEach(function (match) {
          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = "/" + String(match.path || "").replace(/^\/+/, "");
          link.textContent = match.title || match.path;
          const meta = document.createElement("span");
          meta.className = "meta";
          meta.textContent = (match.lang || "en") + " · " + (match.published || "undated");
          item.appendChild(link);
          item.appendChild(meta);
          fragment.appendChild(item);
        });
        hits.replaceChildren(fragment);
      }).catch(function () {
        status.dataset.tone = "error";
        status.textContent = "The archive could not be searched right now.";
      });
    });
  </script>
