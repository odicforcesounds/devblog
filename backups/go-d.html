      function byId(id) {

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) {

        if (text != null) {
          node.textContent = text;
        }
        return node;
      }

      var lang = "en";
      var activeFamily = "all";
      var activeSearch = "";
      var EN = {};

      /* ---------- table ---------- */
      function matches(app) {
        if (activeFamily !== "all" && app.family !== activeFamily) {
          return false;
        }
        if (!activeSearch) {
          return true;
        }
        var hay = [app.name, app.module, app.cmd, app.repo, app.family, app.what.en, app.what.pt,
                   FAMILY_LABEL.en[app.family], FAMILY_LABEL.pt[app.family]].join(" ").toLowerCase();
        return hay.indexOf(activeSearch) !== -1;
      }

      function renderApps() {
        var body = byId("apps-body");
        if (!body) {
          return;
        }
        body.innerHTML = "";
        var shown = 0;
        APPS.forEach(function (app) {
          if (!matches(app)) {
            return;
          }
          shown += 1;
          var tr = el("tr");

          var th = el("th");
          var link = el("a", null, app.name);
          link.href = "https://github.com/" + app.repo;
          link.target = "_blank";
          link.rel = "noopener";
          th.appendChild(link);
          th.appendChild(document.createElement("br"));
          th.appendChild(el("span", "family-tag", FAMILY_LABEL[lang][app.family]));
          tr.appendChild(th);

          tr.appendChild(el("td", null, app.what[lang]));

          var install = el("td");
          install.appendChild(el("code", null, "go install " + app.module + "@" + app.ver));
          tr.appendChild(install);

          var cmdCell = el("td");
          cmdCell.appendChild(el("code", null, app.cmd));
          tr.appendChild(cmdCell);

          tr.appendChild(el("td", null, "≥ " + app.need));

          body.appendChild(tr);
        });

        var empty = byId("apps-empty");
        if (empty) {
          empty.hidden = shown !== 0;
        }
        var count = byId("app-count");
        if (count) {
          count.textContent = shown + " / " + APPS.length;
        }
      }

      function renderChips() {
        var wrap = byId("app-chips");
        if (!wrap) {
          return;
        }
        wrap.innerHTML = "";
        var all = el("button", "chip", lang === "pt" ? "Tudo" : "All");
        all.type = "button";
        all.setAttribute("aria-pressed", activeFamily === "all" ? "true" : "false");
        all.addEventListener("click", function () {
          activeFamily = "all";
          renderChips();
          renderApps();
        });
        wrap.appendChild(all);

        FAMILIES.forEach(function (family) {
          var chip = el("button", "chip", FAMILY_LABEL[lang][family]);
          chip.type = "button";
          chip.setAttribute("aria-pressed", activeFamily === family ? "true" : "false");
          chip.addEventListener("click", function () {
            activeFamily = family;
            renderChips();
            renderApps();
          });
          wrap.appendChild(chip);
        });

      /* ---------- builder ---------- */
      function builderText(app, method, os) {
        var win = os === "win";
        var local = win ? "%USERPROFILE%\\go\\bin\\" + app.cmd + ".exe"
                        : '"$(go env GOPATH)/bin/' + app.cmd + '"';
        var s = "go version    # needs " + app.need + " or newer\n\n";

        if (method === "source") {
          s += "git clone https://github.com/" + app.repo + "\n";
          s += "cd " + app.repo.split("/")[1] + "\n";
          s += app.dir === "." ? "go build -o " + app.cmd + " .\n" : "go build -o " + app.cmd + " ./" + app.dir + "\n";
          s += "install -m 0755 " + app.cmd + " \"$(go env GOPATH)/bin/\"\n\n";
        } else {
          s += "go install " + app.module + "@" + (method === "pinned" ? app.ver : "latest") + "\n\n";
        }

        s += app.cmd + " --help\n\n";
        s += "# the binary: " + local;
        return s;
      }

      function updateBuilder() {
        var appSel = byId("b-app");
        if (!appSel) {
          return;
        }
        var app = APPS[parseInt(appSel.value, 10)] || APPS[0];
        var method = byId("b-method").value;
        var os = byId("b-os").value;

        byId("b-name").textContent = app.name;
        byId("b-pkg").textContent = app.module;
        byId("b-ver").textContent = app.ver;
        byId("b-cmd").textContent = app.cmd;
        byId("b-need").textContent = app.need;
        byId("b-out").textContent = builderText(app, method, os);

      }

      function fillBuilder() {
        var appSel = byId("b-app");
        if (!appSel) {
          return;
        }
        appSel.innerHTML = "";
        APPS.forEach(function (app, index) {
          var option = el("option", null, app.name);
          option.value = String(index);
          appSel.appendChild(option);
        });
        updateBuilder();
      }

      /* ---------- toolchain check ---------- */
      function cmpVersion(a, b) {
        var pa = String(a).split(".").map(Number);
        var pb = String(b).split(".").map(Number);
        for (var i = 0; i < 3; i += 1) {
          var x = pa[i] || 0;
          var y = pb[i] || 0;
          if (x !== y) {
            return x < y ? -1 : 1;
          }
        }
        return 0;
      }

        var appSel = byId("tc-app");
        var mineSel = byId("tc-mine");

          return;

        var app = APPS[parseInt(appSel.value, 10)] || APPS[0];

        var how = byId("tc-how");
        var out = byId("tc-out");

        byId("tc-need").textContent = app.need + " (" + app.name + ")";

        var installCmd = "go install " + app.module + "@" + app.ver;

        if (cmpVersion(mine, app.need) >= 0) {
          verdict.textContent = lang === "pt"
            ? "Suficiente: nada extra é descarregado."
            : "Fine: nothing extra gets downloaded.";
          verdict.dataset.state = "ok";
          how.textContent = lang === "pt"
            ? "O seu Go (" + mine + ") compila " + app.name + " diretamente."
            : "Your Go (" + mine + ") compiles " + app.name + " directly.";
          out.textContent = installCmd + "\n" + app.cmd + " --help";
          return;
        }

        if (mine === "1.21") {
          verdict.textContent = lang === "pt"
            ? "Demasiado antigo, e anterior à troca automática de toolchain."
            : "Too old, and older than automatic toolchain switching.";
          verdict.dataset.state = "bad";
          how.textContent = lang === "pt"
            ? "Instale o Go " + app.need + " a partir de go.dev/dl e repita a instalação."
            : "Install Go " + app.need + " from go.dev/dl, then rerun the install.";
          out.textContent = "# install Go " + app.need + " from https://go.dev/dl/\n" + installCmd;
          return;
        }

        verdict.textContent = lang === "pt"
          ? "O go descarrega o toolchain go" + app.need + " sozinho."
          : "The go command downloads toolchain go" + app.need + " itself.";
        verdict.dataset.state = "mid";
        how.textContent = lang === "pt"
          ? "Com GOTOOLCHAIN=auto (o padrão), verá «go: downloading go" + app.need + "» e a compilação continua. Para forçar, defina GOTOOLCHAIN=go" + app.need + "."
          : "With GOTOOLCHAIN=auto (the default) you will see \"go: downloading go" + app.need + "\" and the build continues. To be explicit, set GOTOOLCHAIN=go" + app.need + ".";
        out.textContent = "GOTOOLCHAIN=go" + app.need + " " + installCmd + "\n" + app.cmd + " --help";
      }

      function fillCheck() {
        var appSel = byId("tc-app");
        var mineSel = byId("tc-mine");
        if (!appSel || !mineSel) {
          return;
        }
        appSel.innerHTML = "";
        APPS.forEach(function (app, index) {
          var option = el("option", null, app.name);
          option.value = String(index);
          appSel.appendChild(option);
        });
        mineSel.innerHTML = "";
        GO_VERSIONS.forEach(function (v) {
          var option = el("option", null, v);
          option.value = v;
          if (v === "1.26") {
            option.selected = true;
          }
          mineSel.appendChild(option);
        });
        updateCheck();
      }

      /* ---------- glossary ---------- */
      function renderGlossary() {
        var list = byId("glossary-list");
        if (!list) {
          return;
        }
        list.innerHTML = "";
        GLOSSARY.forEach(function (entry) {
          var pair = entry[lang];
          list.appendChild(el("dt", null, pair[0]));
          var dd = el("dd");
          dd.innerHTML = pair[1];
          list.appendChild(dd);
        });
      }

      /* ---------- copy ---------- */
      function wireCopy(buttonId, sourceId) {
        var button = byId(buttonId);
        var source = byId(sourceId);
        if (!button || !source) {
          return;
        }
        button.addEventListener("click", function () {
          var text = source.textContent;
          var done = function () {
            button.textContent = lang === "pt" ? "copiado" : "copied";
            window.setTimeout(function () {
              button.textContent = lang === "pt" ? "copiar" : "copy";
            }, 1400);
          };
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(done, done);
              return;
            }
          } catch (error) {
            /* fall through */
          }
          var area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand("copy");
          } catch (error) {
            /* nothing left to try */
          }
          document.body.removeChild(area);
          done();
        });
      }

      /* ---------- language ---------- */
      var TITLE = {
        en: "Go in the Shell — Thirty Binaries, One Toolchain",
        pt: "Go na Shell — Trinta Binários, Uma Toolchain"
      };
      var DESCRIPTION = {
        en: "Go from the terminal: the toolchain, go install, GOBIN on PATH, thirty GitHub apps with verified versions, and the errors that stop a build.",
        pt: "Go a partir do terminal: a toolchain, o go install, o GOBIN no PATH, trinta aplicações do GitHub com versões verificadas e os erros que travam uma compilação."
      };

      var langButtons = [];
      var PT = {};

      function applyLanguage(next) {
        lang = next;
        document.documentElement.lang = next;
        document.querySelectorAll("[data-i18n]").forEach(function (node) {
          var key = node.getAttribute("data-i18n");
          node.innerHTML = next === "pt" && PT[key] != null ? PT[key] : EN[key];
        });
        langButtons.forEach(function (button) {
          button.setAttribute("aria-pressed", button.dataset.lang === next ? "true" : "false");
        });
        document.title = TITLE[next];
        ["description", "og:description", "twitter:description"].forEach(function (name) {
          var node = name === "description"
            ? document.querySelector('meta[name="description"]')
            : document.querySelector('meta[property="' + name + '"]');
          if (node) {
            node.setAttribute("content", DESCRIPTION[next]);
          }
        });
        renderChips();
        renderApps();
        renderGlossary();
        updateBuilder();
        updateCheck();
      }

      langButtons = Array.prototype.slice.call(document.querySelectorAll(".lang-switch button"));
      langButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          applyLanguage(button.dataset.lang);
        });
      });

      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        EN[node.getAttribute("data-i18n")] = node.innerHTML;
      });

      var search = byId("app-search");
      if (search) {
        search.addEventListener("input", function () {
          activeSearch = search.value.trim().toLowerCase();
          renderApps();
        });
      }

      ["b-app", "b-method", "b-os"].forEach(function (id) {
        var node = byId(id);
        if (node) {
          node.addEventListener("change", updateBuilder);
        }
      });
      ["tc-app", "tc-mine"].forEach(function (id) {
        var node = byId(id);
        if (node) {
          node.addEventListener("change", updateCheck);
        }
      });

      wireCopy("b-copy", "b-out");
      wireCopy("tc-copy", "tc-out");

      fillBuilder();
      fillCheck();
      renderChips();
      renderApps();
      renderGlossary();
    })();
  </script>
