      var GLOSSARY = [
        { en: ["Virtual environment", "A folder with its own Python launcher and its own site-packages. Activating it changes only PATH; calling its python directly changes nothing at all."],

      /* ---------- DOM helpers ---------- */
      function byId(id) {
        return document.getElementById(id);
      }

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) {
          node.className = className;
        }
        if (text != null) {
          node.textContent = text;
        }
        return node;
      }

      var lang = "en";
      var activeFamily = "all";
      var activeSearch = "";
      var EN = {};

      /* ---------- apps table ---------- */
      function matches(app) {
        if (activeFamily !== "all" && app.family !== activeFamily) {
          return false;
        }
        if (!activeSearch) {
          return true;
        }
        var hay = [app.name, app.pkg, app.cmd, app.repo, app.family,
                   app.what.en, app.what.pt, FAMILY_LABEL.en[app.family], FAMILY_LABEL.pt[app.family]]
          .join(" ").toLowerCase();
        return hay.indexOf(activeSearch) !== -1;
      }

      function renderApps() {
        var body = byId("apps-body");
        if (!body) {
          return;
        }
        body.innerHTML = "";
        var shown = 0;
        APPS.forEach(function (app) {
          if (!matches(app)) {
            return;
          }
          shown += 1;
          var tr = el("tr");

          var th = el("th");
          var link = el("a", null, app.name);
          link.href = "https://github.com/" + app.repo;
          link.target = "_blank";
          link.rel = "noopener";
          th.appendChild(link);
          var tag = el("span", "family-tag", FAMILY_LABEL[lang][app.family]);
          th.appendChild(document.createElement("br"));
          th.appendChild(tag);
          tr.appendChild(th);

          var what = el("td", null, app.what[lang]);
          tr.appendChild(what);

          var install = el("td");
          var code = el("code", null, 'pipx install "' + app.pkg + '"');
          install.appendChild(code);
          tr.appendChild(install);

          var cmdCell = el("td");
          var cmd = el("code", null, app.cmd);
          cmdCell.appendChild(cmd);
          tr.appendChild(cmdCell);

          body.appendChild(tr);
        });

        var empty = byId("apps-empty");
        if (empty) {
          empty.hidden = shown !== 0;
        }
        var count = byId("app-count");
        if (count) {
          count.textContent = shown + " / " + APPS.length;
        }
      }

      function renderChips() {
        var wrap = byId("app-chips");
        if (!wrap) {
          return;
        }
        wrap.innerHTML = "";
        var all = el("button", "chip", lang === "pt" ? "Tudo" : "All");
        all.type = "button";
        all.setAttribute("aria-pressed", activeFamily === "all" ? "true" : "false");
        all.addEventListener("click", function () {
          activeFamily = "all";
          renderChips();
          renderApps();
        });
        wrap.appendChild(all);

        FAMILIES.forEach(function (family) {
          var chip = el("button", "chip", FAMILY_LABEL[lang][family]);
          chip.type = "button";
          chip.setAttribute("aria-pressed", activeFamily === family ? "true" : "false");
          chip.addEventListener("click", function () {
            activeFamily = family;
            renderChips();
            renderApps();
          });
          wrap.appendChild(chip);
        });
      }

      /* ---------- install builder ---------- */
      function systemsLine(app, os) {
        if (!app.sys) {
          return "";
        }
        if (os === "linux" && app.sys.apt) {
          return "sudo apt install " + app.sys.apt + "\n\n";
        }
        if (os === "mac" && app.sys.brew) {
          return "brew install " + app.sys.brew + "\n\n";
        }
        return "";
      }

      function builderText(app, method, os) {
        var s = systemsLine(app, os);
        var qty = app.pkg.indexOf("[") !== -1 ? '"' + app.pkg + '"' : app.pkg;
        var win = os === "win";
        var py = win ? "py" : "python3";

        if (method === "pipx") {
          s += "# pipx, once per machine\n";
          s += win ? "py -m pip install --user pipx\npy -m pipx ensurepath\n"
                   : py + " -m pip install --user pipx\n" + py + " -m pipx ensurepath\n";
          s += "# open a new terminal\n\n";
          s += "pipx install " + qty + "\n";
          s += app.cmd + " --help";
          return s;
        }

        if (method === "uv") {
          s += "# uv, once per machine\n";
          s += win ? 'powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"'
                   : "curl -LsSf https://astral.sh/uv/install.sh | sh";
          s += "\n\nuv tool install " + qty + "\n" + app.cmd + " --help";
          return s;
        }

        var dir = win ? "%USERPROFILE%\\.venvs\\" + app.key : "~/.venvs/" + app.key;
        var bin = win ? dir + "\\Scripts" : dir + "/bin";
        s += py + " -m venv " + dir + "\n";
        s += bin + (win ? "\\pip" : "/pip") + " install " + qty + "\n";
        s += bin + (win ? "\\" + app.cmd + ".exe" : "/" + app.cmd) + " --help";
        return s;
      }

      function updateBuilder() {
        var appSel = byId("b-app");
        var methodSel = byId("b-method");
        var osSel = byId("b-os");
        if (!appSel || !methodSel || !osSel) {
          return;
        }
        var app = APPS[parseInt(appSel.value, 10)] || APPS[0];
        var method = methodSel.value;
        var os = osSel.value;

        byId("b-name").textContent = app.name;
        byId("b-pkg").textContent = app.pkg;
        byId("b-cmd").textContent = app.cmd;
        byId("b-deps").textContent = app.deps[lang];
        byId("b-out").textContent = builderText(app, method, os);
        byId("b-note").textContent = lang === "pt"
          ? "Python " + app.py + " ou mais recente. Se o comando não for encontrado depois de instalar, a parte 05 tem a resposta."
          : "Python " + app.py + " or newer. If the command is not found after installing, part 05 has the answer.";
      }

      function fillBuilder() {
        var appSel = byId("b-app");
        if (!appSel) {
          return;
        }
        appSel.innerHTML = "";
        APPS.forEach(function (app, index) {
          var option = el("option", null, app.name);
          option.value = String(index);
          appSel.appendChild(option);
        });
        updateBuilder();
      }

      /* ---------- decision tool ---------- */
      function verdict() {
        var imports = byId("d-import").value === "yes";
        var often = byId("d-often").value;
        var uv = byId("d-uv").value === "yes";

        if (imports) {
          return {
            state: "ok",
            title: lang === "pt" ? "Um ambiente virtual, dentro do projeto" : "A virtual environment, inside the project",
            why: lang === "pt"
              ? "O seu código vai fazer import do pacote, por isso precisa das versões certas no interpretador que corre esse código — e nada disso deve tocar no Python do sistema."
              : "Your code will import the package, so it needs the right versions in the interpreter that runs that code — and none of that should touch the system Python.",
            cmd: "cd ~/projects/myapp\npython3 -m venv .venv\nsource .venv/bin/activate\npython -m pip install --upgrade pip\npip install PACKAGE\npip freeze > requirements.txt"
          };
        }
        if (often === "once") {
          return {
            state: "mid",
            title: lang === "pt" ? "Não instale: execute uma vez" : "Do not install it: run it once",
            why: lang === "pt"
              ? "Se é para experimentar, um ambiente temporário é suficiente e não deixa nada no PATH. Se gostar, instale a seguir com pipx."
              : "If it is an experiment, a throwaway environment is enough and leaves nothing on your PATH. If you like it, install it properly afterwards.",
            cmd: uv ? "uvx PACKAGE --help" : "pipx run PACKAGE --help"
          };
        }
        if (uv) {
          return {
            state: "ok",
            title: lang === "pt" ? "uv tool install" : "uv tool install",
            why: lang === "pt"
              ? "Já usa uv: instale como ferramenta, com o seu próprio ambiente e o lançador em ~/.local/bin, e atualize tudo com um comando."
              : "You already use uv: install it as a tool, with its own environment and its launcher in ~/.local/bin, and upgrade everything with one command.",
            cmd: "uv tool install PACKAGE\nPACKAGE --help\nuv tool upgrade --all"
          };
        }
        return {
          state: "ok",
          title: lang === "pt" ? "pipx install" : "pipx install",
          why: lang === "pt"
            ? "Uma aplicação, um ambiente, um lançador. É o caminho com menos decisões e o que este manual usa por omissão."
            : "One app, one environment, one launcher. It is the path with the fewest decisions, and the one this manual uses by default.",
          cmd: "python3 -m pip install --user pipx\npython3 -m pipx ensurepath\npipx install PACKAGE\nPACKAGE --help"
        };
      }

      function updateDecision() {
        var v = verdict();
        var out = byId("d-verdict");
        if (!out) {
          return;
        }
        out.textContent = v.title;
        out.dataset.state = v.state;
        byId("d-why").textContent = v.why;
        byId("d-out").textContent = v.cmd;
      }

      /* ---------- glossary ---------- */
      function renderGlossary() {
        var list = byId("glossary-list");
        if (!list) {
          return;
        }
        list.innerHTML = "";
        GLOSSARY.forEach(function (entry) {
          var pair = entry[lang];
          list.appendChild(el("dt", null, pair[0]));
          list.appendChild(el("dd", null, pair[1]));
        });
      }

      /* ---------- copy ---------- */
      function wireCopy(buttonId, sourceId) {
        var button = byId(buttonId);
        var source = byId(sourceId);
        if (!button || !source) {
          return;
        }
        button.addEventListener("click", function () {
          var text = source.textContent;
          var done = function () {
            var previous = button.getAttribute("data-label") || button.textContent;
            button.setAttribute("data-label", previous);
            button.textContent = lang === "pt" ? "copiado" : "copied";
            window.setTimeout(function () {
              button.textContent = lang === "pt" ? "copiar" : "copy";
            }, 1400);
          };
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(done, done);
              return;
            }
          } catch (error) {
            /* fall through to the textarea */
          }
          var area = document.createElement("textarea");
          area.value = text;
          document.body.appendChild(area);
          area.select();
          try {
            document.execCommand("copy");
          } catch (error) {
            /* nothing left to try */
          }
          document.body.removeChild(area);
          done();
        });
      }

      /* ---------- language ---------- */
      var TITLE = {
        en: "The Shell, Extended — Thirty Python Apps and One Clean Install",
        pt: "A Shell, Alargada — Trinta Aplicações Python e Uma Instalação Limpa"
      };
      var DESCRIPTION = {
        en: "A practical manual for running Python tools from the terminal: virtual environments, pipx, uv, thirty GitHub apps, the errors that stop an install, and the sources behind each command.",
        pt: "Manual prático para correr ferramentas Python a partir do terminal: ambientes virtuais, pipx, uv, trinta aplicações do GitHub, os erros que travam uma instalação e as fontes de cada comando."
      };

      var langButtons = [];
      var PT = {};

      function applyLanguage(next) {
        lang = next;
        document.documentElement.lang = next;
        document.querySelectorAll("[data-i18n]").forEach(function (node) {
          var key = node.getAttribute("data-i18n");
          node.innerHTML = next === "pt" && PT[key] != null ? PT[key] : EN[key];
        });
        langButtons.forEach(function (button) {
          button.setAttribute("aria-pressed", button.dataset.lang === next ? "true" : "false");
        });
        document.title = TITLE[next];
        ["description", "og:description", "twitter:description"].forEach(function (name) {
          var node = name === "description"
            ? document.querySelector('meta[name="description"]')
            : document.querySelector('meta[property="' + name + '"]');
          if (node) {
            node.setAttribute("content", DESCRIPTION[next]);
          }
        });
        renderChips();
        renderApps();
        renderGlossary();
        updateBuilder();
        updateDecision();
      }

      /* ---------- start ---------- */
      langButtons = Array.prototype.slice.call(document.querySelectorAll(".lang-switch button"));
      langButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          applyLanguage(button.dataset.lang);
        });
      });

      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        EN[node.getAttribute("data-i18n")] = node.innerHTML;
      });

      var search = byId("app-search");
      if (search) {
        search.addEventListener("input", function () {
          activeSearch = search.value.trim().toLowerCase();
          renderApps();
        });
      }

      ["b-app", "b-method", "b-os"].forEach(function (id) {
        var node = byId(id);
        if (node) {
          node.addEventListener("change", updateBuilder);
        }
      });
      ["d-import", "d-often", "d-uv"].forEach(function (id) {
        var node = byId(id);
        if (node) {
          node.addEventListener("change", updateDecision);
        }
      });

      wireCopy("b-copy", "b-out");
      wireCopy("d-copy", "d-out");

      fillBuilder();
      renderChips();
      renderApps();
      renderGlossary();
      updateDecision();
    })();
  </script>
